name: Reproduce manuscript results

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MPLBACKEND: Agg
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install declared dependencies
        run: python -m pip install -r requirements.txt

      - name: Run independent numerical tests
        run: python -m unittest discover -s tests -v

      - name: Recompute the manuscript analyses
        run: python run_analysis.py

      - name: Compare results and all manuscript tables
        run: python scripts/check_reproduction.py

      - name: Rebuild supplementary methods
        run: python scripts/build_supplement.py

      - name: Retain reproduced results
        uses: actions/upload-artifact@v7
        with:
          name: cold-chain-reproduced-results
          path: |
            results/
            docs/Supplementary_Material.docx
          retention-days: 30
          if-no-files-found: error
